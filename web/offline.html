<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · CoolCloud</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f4f7fa;
        --surface: #fff;
        --text: #152433;
        --text-2: #566576;
        --border: #dbe4ec;
        --accent: #0b5fb0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c141c;
          --surface: #131e28;
          --text: #eaf1f8;
          --text-2: #a7b6c5;
          --border: #26394a;
          --accent: #58a9ea;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: radial-gradient(circle at 20% 0%, rgba(11, 95, 176, 0.16), transparent 45%), var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.4);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #0b3a5c;
        color: #fff;
        font-weight: 800;
      }
      .mark i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #58a9ea;
      }
      h1 {
        font-size: 20px;
        margin: 18px 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--text-2);
        font-size: 13.5px;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">C<i></i>L</span>
      <h1>You’re offline</h1>
      <p>CoolCloud needs a connection to load your workspace. Your saved page will open as soon as you’re back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
